# =====================================================================
# Student Management System - default configuration (MySQL)
# =====================================================================
spring.application.name=student-management-system

# ---------- MySQL ----------
# Create the schema once before starting the app:
#   CREATE DATABASE student_management_db;
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" keeps existing rows safe between restarts.
# Use "create-drop" only while experimenting (it wipes the schema on stop).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=true

# ---------- Server ----------
# ${PORT:8080} -> deployment platforms (Render/Railway) inject PORT automatically
server.port=${PORT:8080}
