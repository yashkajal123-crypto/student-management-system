# =====================================================================
# "demo" profile - runs the project with an embedded H2 database
# (MySQL not required). Start with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=demo
# Data is stored in ./data so it survives restarts.
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/student_management_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
